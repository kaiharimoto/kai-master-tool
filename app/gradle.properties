org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
# Left off while the build is young: it makes AGP and Compose plugin failures
# report at their real source instead of as a cache-serialisation error.
org.gradle.configuration-cache=false
org.gradle.parallel=true

kotlin.code.style=official
# Neue compiles for the desk and Android at once in one daemon; 2g ran out on CI as the goldfish landed (1.1.18).
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g

android.useAndroidX=true
android.nonTransitiveRClass=true

# ---------------------------------------------------------------------------
# Release identity. The release workflow overrides both from the pushed tag, so
# these values are what a local build produces.
# ---------------------------------------------------------------------------
mastertool.versionName=1.0.0
mastertool.versionCode=1

# Signing. This keystore is committed on purpose: the in-app updater can only
# replace the installed app if every build carries the same signature, and a
# CI-generated debug key changes on every run. See androidApp/keystore/README.md
# for what this does and does not protect.
mastertool.storeFile=keystore/kai-master-tool.jks
mastertool.storePassword=kaimastertool
mastertool.keyAlias=kai-master-tool
mastertool.keyPassword=kaimastertool
