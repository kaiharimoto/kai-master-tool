[versions]
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.7.1"
ktor = "3.5.1"
anthropic = "2.66.0"
sqldelight = "2.3.2"  # keep in sync with the plugin version in settings.gradle.kts
coil = "3.5.0"
androidxActivity = "1.10.1"
androidxCore = "1.15.0"
zxing = "3.5.4"
zxingAndroid = "4.3.0"
# Whisper (whisper.cpp) for the desk's on-device voice input, natives bundled for Windows, macOS and Linux (1.0.57).
whisperJni = "1.7.1"
# Ai World's JavaScript (1.0.97): Mozilla Rhino, MPL-2.0, pure Java, interpreted on Android too. 1.7.15 on purpose:
# 1.8+ require jdk.dynalink and java.beans, which Android does not have.
rhino = "1.7.15.1"
# Present's recording (1.1.13), the desk only: JavaCV (Apache 2.0) over JavaCPP (Apache 2.0) and bytedeco's FFmpeg
# build WITHOUT a classifier suffix — LGPL v3, built --enable-version3 and never --enable-gpl. Never the `-gpl`
# classifiers (x264, x265): this app is MIT. JavaCV's own POM pulls OpenCV, OpenBLAS, librealsense and more (about
# 1 GB of natives), so it is taken without its transitives and javacpp + ffmpeg are named here alone; each
# installer carries its own platform's natives only (`neue/build.gradle.kts`). `docs/present/RECORDING.md`.
javacv = "1.5.14"
javacpp = "1.5.14"
ffmpeg = "8.1.2-1.5.14"

# JDK used for every module's toolchain and bytecode target.
jdk = "21"

# Android SDK levels. minSdk 26 keeps java.time / modern APIs available without
# desugaring; targetSdk 36 is what the Tab S11 Ultra expects.
minSdk = "26"
targetSdk = "36"
compileSdk = "36"

[libraries]
whisper-jni = { module = "io.github.givimad:whisper-jni", version.ref = "whisperJni" }
rhino = { module = "org.mozilla:rhino", version.ref = "rhino" }
javacv = { module = "org.bytedeco:javacv", version.ref = "javacv" }
javacpp = { module = "org.bytedeco:javacpp", version.ref = "javacpp" }
ffmpeg = { module = "org.bytedeco:ffmpeg", version.ref = "ffmpeg" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
# The Lounge's door on the desk (docs/LOUNGE.md): a small web server and its WebSocket, never in the APK.
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropic" }

sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-coroutines = { module = "app.cash.sqldelight:coroutines-extensions", version.ref = "sqldelight" }
sqldelight-driver-android = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-driver-jvm = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
sqldelight-driver-native = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }

# QR codes (v1.3.7): ZXing draws a deck's on the desk and reads one out of a
# picture; its Android scanner is the camera screen on a phone or a tablet.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-android = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingAndroid" }
