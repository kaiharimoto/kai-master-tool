name: Release APK

# Publishes a signed APK as a GitHub release. The in-app updater reads the
# latest release from the public API and installs the .apk asset attached here,
# so the asset name and the tag are part of the contract.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (stable installs will ignore it)'
        required: false
        default: false
        type: boolean
      notes:
        description: 'Release notes (Markdown). Empty generates them from the commits.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from the version name, not from history - see
          # the comment on the step below for why that changed. The full history
          # is still wanted, for the compare link in the generated release notes.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          NAME="${RAW#v}"

          # versionCode must increase monotonically or Android refuses the
          # update with "package appears to be invalid". Commit count is NOT
          # monotonic across branches — v1.1.0 shipped as 281 from a
          # 281-commit working branch, after which a 61-commit branch produced
          # 61 and every device refused it. Deriving the code from the version
          # itself is monotonic exactly as long as releases are, and the
          # +100000 floor keeps it above anything the old scheme ever emitted.
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$((100000 + MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"   >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"
          echo "Releasing v$NAME (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages: ''` because the action's default is `tools platform-tools`,
      # and `tools` was removed from Google's repository - sdkmanager now exits 1
      # with "Failed to find package 'tools'" and takes the whole job with it. The
      # runner image already ships an SDK; what is wanted from this action is the
      # accepted licences and ANDROID_HOME, not a download.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: app
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Pmastertool.versionName=${{ steps.version.outputs.name }} \
            -Pmastertool.versionCode=${{ steps.version.outputs.code }} \
            --stacktrace

      - name: Name the APK after the release
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/androidApp/build/outputs/apk/release -name '*.apk' | head -1)"
          DEST="kai-master-tool-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify the signing certificate
        env:
          # SHA-256 of androidApp/keystore/kai-master-tool.jks. A release signed
          # with anything else cannot install over an existing copy, so this is
          # a hard gate rather than a warning.
          EXPECTED_SHA256: 0bb9cc076e3ac23330e27c87711ec34ca917d8c2471385c6a6b550e1301cb22c
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" | tee certs.txt

          # Normalised so colons or upper-case hex cannot cause a false failure.
          NORMALISED="$(tr -d ':' < certs.txt | tr 'A-Z' 'a-z')"
          if ! grep -q "$EXPECTED_SHA256" <<< "$NORMALISED"; then
            echo "::error::APK is not signed with the committed release key"
            exit 1
          fi
          echo "Signing certificate verified."

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
          # Through the environment, never pasted into the script: notes are prose.
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi
          # A release that changes what is stored on the device says so in its
          # notes (CLAUDE.md, "Ship Every Change"); those are written by hand.
          if [ -n "${NOTES:-}" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
            NOTES_ARGS=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            if [ -n "${NOTES:-}" ]; then gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"; fi
          else
            gh release create "$TAG" "$APK" \
              --title "kai's master tool $TAG" \
              "${NOTES_ARGS[@]}" \
              $PRERELEASE
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kai-master-tool-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
