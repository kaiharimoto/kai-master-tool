name: Shoot Neue for the README

# The pictures in the root README: Neue Master Tool drawn by `:studio` into an
# ImageComposeScene — real theme, real dependencies, real card art — with no
# window and no GPU. `tools/shoot.sh` is the same command a developer runs.
#
# Dispatch only, on the claude/** branch, never on `main`: `main` is a strict
# fast-forward of the working branch, and a commit this workflow put on `main`
# would be one the next fast-forward is rejected by.

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit the result. Off renders, checks and uploads the artifact only.'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: shots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shoot:
    name: Render and commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse to commit to the default branch
        if: ${{ inputs.commit && github.ref_name == 'main' }}
        run: |
          echo "::error::shoot on the claude/** branch and let main fast-forward onto it, or re-run with commit off"
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Pillow
        run: python3 -m pip install --quiet --disable-pip-version-check pillow

      # One page per run: the studio composes once and photographs it.
      - name: Render
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/shots"
          shoot() { tools/shoot.sh --out="$out" "$@" 2>&1 | tee -a "$RUNNER_TEMP/shoot.log"; }
          shoot --page=builder --name=neue-builder --groups=true
          shoot --page=builder --name=neue-builder-ink --theme=ink --groups=true
          shoot --page=builder --name=neue-search --studio=deck --query=labrynth
          shoot --page=decks --name=neue-decks --save=true --default=true
          shoot --page=odds --name=neue-odds
          shoot --page=builder --name=neue-zen --zen=deep --zen-seconds=4 --groups=true --zen-groups=true

      # The studio is cheerful about failure: a pool that did not sync renders a
      # pretty, empty page and exits 0. A page of card art has thousands of
      # colours; an empty one has a handful, so that is what is refused.
      - name: Check and resample into docs/shots
        run: |
          python3 - <<'PY'
          import os, sys
          from PIL import Image
          raw = os.path.join(os.environ["RUNNER_TEMP"], "shots")
          names = ["neue-builder", "neue-builder-ink", "neue-search", "neue-decks", "neue-odds", "neue-zen"]
          bad = []
          for n in names:
              path = os.path.join(raw, n + ".png")
              if not os.path.isfile(path):
                  bad.append(f"{n}: missing"); continue
              im = Image.open(path).convert("RGB")
              colours = len(im.getcolors(maxcolors=1 << 20) or [])
              floor = 64 if n in ("neue-decks", "neue-odds") else 2000
              if colours < floor:
                  bad.append(f"{n}: {colours} colours, an empty page")
                  continue
              im.resize((1600, round(im.height * 1600 / im.width)), Image.LANCZOS).save(f"docs/shots/{n}.png", optimize=True)
              print(f"{n}: {colours} colours")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          PY

      - name: Commit if any pixels moved
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git add -- docs/shots
          if git diff --cached --quiet; then
            echo "Nothing moved."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "The README's pictures are re-shot from ${GITHUB_SHA:0:7}" \
            -m "Rendered by .github/workflows/shots.yml run ${GITHUB_RUN_ID}."
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push the pictures after three attempts"
          exit 1

      - name: Upload the originals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-full-size
          path: ${{ runner.temp }}/shots/*.png
          retention-days: 14
          if-no-files-found: ignore
