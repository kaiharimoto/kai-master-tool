name: Build kai's master tool

# The Android SDK, the Android Gradle Plugin and every androidx artifact are
# served only from Google's Maven. CI is where those are reachable, so this is
# what turns the sources in app/ into an installable APK.

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'app/**'
      - 'tools/budgets.json'
      - 'tools/budgets.py'
      - 'tools/compare.py'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'app/**'
  workflow_dispatch:

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Android is switched off here so the domain layer is exercised on its own:
      # if this job fails, the problem is in the rules, not in the UI or the SDK.
      - name: Run :core tests
        working-directory: app
        run: ./gradlew :core:jvmTest -Pmastertool.android=false --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: app/core/build/reports/tests/jvmTest
          if-no-files-found: ignore

  # The Lounge's browser table (docs/LOUNGE.md) is the same code compiled to WebAssembly: :core's tests run
  # again on Node, where a JVM-only call or an order that leans on the JVM's HashMap shows, and the duel
  # table (:table) compiles for the browser. What runs only on kai's computer — Ai's wire, the goldfish's
  # threads — is tested in jvmTest. Kotlin's web tooling is fetched from GitHub, which a sandbox may not
  # reach; here it always can.
  web:
    name: Browser (WebAssembly)
    runs-on: ubuntu-latest
    # Its own cache key (2026-10-10): main's run during a Maven Central rate limit saved a Gradle home that remembers the
    # build's plugin jars as missing, and every run that restored it failed in five seconds without asking again.
    env:
      GRADLE_BUILD_ACTION_CACHE_KEY_PREFIX: web2-
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Core tests on Node, and the table for the browser
        working-directory: app
        run: ./gradlew :core:wasmJsNodeTest :table:compileKotlinWasmJs -Pmastertool.android=true --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-wasm-test-report
          path: app/core/build/reports/tests/wasmJsNodeTest
          if-no-files-found: ignore

      # The Lounge's page as a release packs it (binaryen's optimised module), then walked end to end in Chromium:
      # passcode, name, a deck, a seat and the opening throw, which kai's computer must see (docs/LOUNGE.md).
      - name: The Lounge's page
        working-directory: app
        run: ./gradlew :guest:guestBundle -Pmastertool.android=true -Pmastertool.guestOptimize=true --stacktrace && du -sh guest/build/lounge && ls -la guest/build/lounge

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright's Chromium
        working-directory: tools/lounge
        run: npm install --no-save --no-package-lock playwright@1 && npx playwright install --with-deps chromium

      - name: The Lounge end to end
        run: tools/lounge/smoke.sh

      - name: Upload the Lounge's screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lounge-smoke
          path: shots/lounge
          if-no-files-found: ignore

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # `packages: ''` because the action's default is `tools platform-tools`,
      # and `tools` was removed from Google's repository - sdkmanager now exits 1
      # with "Failed to find package 'tools'" and takes the whole job with it. The
      # runner image already ships an SDK; what is wanted from this action is the
      # accepted licences and ANDROID_HOME, not a download.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: app
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kai-master-tool-debug-apk
          path: app/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  neue:
    name: Neue Master Tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      # The Master UI law test runs here (MasterUiLawTest): a colour, a radius or
      # a shadow anywhere in Neue fails the build, the way `check.mjs` fails a web
      # project in the family — and SharedPortabilityTest refuses a desktop-only
      # API in the code Android shares. Packaging the .deb as well catches a
      # missing JVM module or resource before a release does; the Android library
      # build is Neue compiled for the tablet.
      - name: Packaging tools
        run: sudo apt-get install -y -qq fakeroot

      - name: Test and package
        working-directory: app
        run: ./gradlew :neue:jvmTest :neue:packageDeb :neue:assembleDebug -Pmastertool.android=true --stacktrace

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: neue-master-tool-deb
          path: app/neue/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error

  # Phase I, I.7 (F5, F6): the builder, duel, world and present pages photographed by the studio, compared with the
  # shots of the last release (the newest green run of this workflow on main, which is what releases build from), so a
  # change of layout is seen in the summary before it ships; and each page held to its frame and memory budget
  # (tools/budgets.json). A difference is reported, never a failure: a layout may change on purpose. An empty page, or
  # a page over its budget, fails.
  studio:
    name: Studio shots and budgets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Pillow
        run: pip install --quiet pillow

      # The card pool and the art the studio draws with, kept a week: a cold cache reads tens of megabytes from
      # YGOPRODeck, and art that arrives late is a picture that differs from the last one for no reason of ours.
      - name: Week
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/mastertool-studio
          key: studio-cache-${{ steps.week.outputs.week }}
          restore-keys: studio-cache-

      - name: Shoot
        run: |
          out="$RUNNER_TEMP/studio"
          mkdir -p "$out"
          shoot() { tools/shoot.sh --out="$out" --measure=true "$@"; }
          shoot --page=builder --name=builder --groups=true
          shoot --page=duel --name=duel --duel=two --duel-play=true
          shoot --page=world --name=world --world=demo
          shoot --page=present --name=present --present=demo
          ls -l "$out"

      # As shots.yml refuses one: a page with too few colours is a pool that did not sync, or a page that never drew.
      - name: Refuse an empty page
        run: |
          python3 - "$RUNNER_TEMP/studio" <<'PY'
          import pathlib, sys
          from PIL import Image
          bad = []
          for n in ("builder", "duel", "world", "present"):
              p = pathlib.Path(sys.argv[1]) / f"{n}.png"
              if not p.exists():
                  bad.append(f"{n}: missing"); continue
              colours = len(Image.open(p).convert("RGB").getcolors(maxcolors=1 << 20) or [])
              if colours < 64:
                  bad.append(f"{n}: {colours} colours, an empty page")
          print("\n".join(bad) or "every page drew")
          sys.exit(1 if bad else 0)
          PY

      - name: The last release's shots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list --repo "${{ github.repository }}" --workflow build-app.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          mkdir -p "$RUNNER_TEMP/baseline"
          if [ -n "$id" ] && gh run download "$id" --repo "${{ github.repository }}" -n studio-shots -D "$RUNNER_TEMP/baseline"; then
            echo "baseline=run $id" >> "$GITHUB_ENV"
          else
            echo "baseline=none" >> "$GITHUB_ENV"
          fi

      - name: Compare
        run: |
          {
            echo "### Studio shots against the last release ($baseline)"
            echo
            echo '```'
            python3 tools/compare.py "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/studio" "$RUNNER_TEMP/compare" || true
            echo '```'
            echo
            echo "The sheets (before | after, the difference ×12 under them) are the studio-compare artifact."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Budgets
        run: python3 tools/budgets.py "$RUNNER_TEMP/studio" tools/budgets.json | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"

      - name: Upload the shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-shots
          path: |
            ${{ runner.temp }}/studio/*.png
            ${{ runner.temp }}/studio/*.json
          retention-days: 90

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-compare
          path: ${{ runner.temp }}/compare/*.png
          if-no-files-found: ignore
          retention-days: 14
