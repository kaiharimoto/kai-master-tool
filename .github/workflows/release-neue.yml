name: Release Neue Master Tool

# Publishes Neue Master Tool — the desktop builder in Master UI — as a GitHub
# release with a Windows .msi, two macOS .dmgs (Apple silicon `-arm64`, Intel
# `-x64`, from 1.0.21) and a Linux .deb attached. The app's own updater
# (`NeueReleaseTrack`) finds it there, and a Mac takes the one for its processor.
#
# ## The Mac signing switch, off
#
# With the five secrets MAC_CERT_P12 (a base64 Developer ID Application .p12),
# MAC_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an
# app-specific password) in the repository, the Mac legs import the certificate,
# build signed with the hardened runtime (`app/neue/macos/entitlements.plist`),
# notarise and staple. Without them — today — nothing about the .dmg changes.
#
# ## A third track, kept apart the way the 3DS one is
#
# Tags are `neue-v1.0.0`, never `v*`, and every release is a **pre-release**.
# Both are load-bearing, for the reason spelled out at the top of
# `release-3ds.yml`: GitHub's `/releases/latest` returns the newest
# *non*-pre-release of any tag shape, and every installed APK asks exactly that
# endpoint for its update. A Neue release that was not a pre-release would
# become the repository's "Latest" and hide the next APK from every tablet.
# `AppVersion.parse("neue-v…")` reads as unknown as a second fence
# (`NeueReleaseTrackTest` pins it). Neue itself lists releases and filters by
# the prefix, so the pre-release flag costs it nothing.
#
# ## The permanent numbers
#
# - The version only goes up. Windows Installer treats an equal or lower
#   version as "already installed" and the in-app update does nothing.
#   MSI versions are `major.minor.build` with major and minor under 256 and
#   build under 65536 — ample, but it is why the version is three numbers.
# - `windows.upgradeUuid` in `app/neue/build.gradle.kts` is fixed forever. An
#   MSI with a different one installs *beside* the old app instead of over it.

on:
  push:
    tags:
      - 'neue-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (tagged neue-v1.0.1)'
        required: true
        type: string
      republish:
        description: 'Re-publish the newest version (asset or notes fixes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-neue
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          NAME="${RAW#neue-v}"
          NAME="${NAME#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$NAME' is not major.minor.patch."
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$NAME"
          if [ "$MAJ" -lt 1 ] || [ "$MAJ" -gt 255 ] || [ "$MIN" -gt 255 ] || [ "$PAT" -gt 65535 ]; then
            echo "::error::$NAME cannot be an MSI or DMG version (major 1-255, minor 0-255, patch 0-65535)."
            exit 1
          fi
          PREV="$(git tag -l 'neue-v*' | sed 's/^neue-v//' \
                  | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$PREV" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$PREV" "$NAME" | sort -V | tail -1)"
            if [ "$HIGHEST" != "$NAME" ]; then
              echo "::error::$NAME does not come after the last released $PREV."
              exit 1
            fi
            if [ "$NAME" = "$PREV" ] && [ "${{ inputs.republish }}" != "true" ]; then
              echo "::error::$NAME is already released. Pass republish=true to publish over it."
              exit 1
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=neue-v$NAME" >> "$GITHUB_OUTPUT"
          echo "Releasing neue-v$NAME (previous: ${PREV:-none})"

  package:
    name: Package (${{ matrix.os }}${{ matrix.arch && format(' {0}', matrix.arch) || '' }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            task: packageMsi
            ext: msi
          # Apple silicon and Intel: a bundled JDK is native code, so each Mac
          # needs a build made on its own kind of processor.
          - os: macos-latest
            task: packageDmg
            ext: dmg
            arch: arm64
            uname: arm64
          - os: macos-15-intel
            task: packageDmg
            ext: dmg
            arch: x64
            uname: x86_64
          - os: ubuntu-latest
            task: packageDeb
            ext: deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # :neue and :builder apply the Android library plugin, so an SDK has to
      # be present to configure them even for a desktop build. `packages: ''` for the reason given in build-app.yml.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - uses: gradle/actions/setup-gradle@v4

      - name: Packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq fakeroot

      # A runner label that quietly changed processor would ship an arm64 build
      # named x64. Refuse it here rather than on somebody's Mac.
      - name: The processor is the one this leg is for
        if: matrix.uname
        run: |
          test "$(uname -m)" = "${{ matrix.uname }}" || { echo "::error::expected ${{ matrix.uname }}, runner is $(uname -m)"; exit 1; }

      - name: Signing identity (only with the Apple secrets)
        if: runner.os == 'macOS'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MAC_CERT_P12:-}" ]; then
            echo "No MAC_CERT_P12: the .dmg is built unsigned, as always."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/neue-signing.keychain-db"
          KEYPASS="$(openssl rand -hex 16)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYPASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYPASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYPASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          # Compose wants the name after "Developer ID Application: ".
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"Developer ID Application: \(.*\)"/\1/p' | head -1)"
          test -n "$IDENTITY" || { echo "::error::no Developer ID Application identity in MAC_CERT_P12"; exit 1; }
          echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Package
        working-directory: app
        env:
          # Google Drive sync (1.0.69): the app's Google registration, from the repository's secrets.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: ./gradlew :neue:${{ matrix.task }} -Pmastertool.android=true -Pneue.versionName=${{ needs.version.outputs.name }} --stacktrace

      - name: Notarise (only when signed)
        if: runner.os == 'macOS' && env.MAC_SIGN_IDENTITY != ''
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :neue:notarizeDmg -Pmastertool.android=true -Pneue.versionName=${{ needs.version.outputs.name }} --stacktrace
          xcrun stapler staple "$(find neue/build/compose/binaries -type f -name '*.dmg' | head -1)"

      - name: Name the installer
        run: |
          set -euo pipefail
          FOUND="$(find app/neue/build/compose/binaries -type f -name "*.${{ matrix.ext }}" | head -1)"
          if [ -z "$FOUND" ]; then
            echo "::error::no .${{ matrix.ext }} was produced"
            exit 1
          fi
          # The name NeueReleaseTrack.installerName expects, so the updater finds it.
          ARCH="${{ matrix.arch }}"
          cp "$FOUND" "neue-master-tool-${{ needs.version.outputs.name }}${ARCH:+-$ARCH}.${{ matrix.ext }}"
          ls -l neue-master-tool-*

      - uses: actions/upload-artifact@v4
        with:
          name: neue-${{ matrix.ext }}${{ matrix.arch && format('-{0}', matrix.arch) || '' }}
          path: neue-master-tool-*.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: neue-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail
          ls -l neue-master-tool-*
          for file in "$NAME.msi" "$NAME-arm64.dmg" "$NAME-x64.dmg" "$NAME.deb"; do
            test -f "neue-master-tool-$file" || { echo "::error::missing neue-master-tool-$file"; exit 1; }
          done

          NOTES=$(mktemp)
          {
            echo "Neue Master Tool $NAME — the deck builder for the desktop, in Master UI."
            echo
            echo "- **Windows:** \`neue-master-tool-$NAME.msi\`. Installs for your user, no administrator needed. Windows may warn that the publisher is unknown; the installer is not code-signed yet."
            echo "- **macOS:** \`neue-master-tool-$NAME-arm64.dmg\` for Apple silicon (M1 and later), \`neue-master-tool-$NAME-x64.dmg\` for an Intel Mac. Drag it into Applications. The first time, right-click the app and choose Open, because it is not notarised. After that, updates install themselves."
            echo "- **Linux:** \`neue-master-tool-$NAME.deb\`."
            echo
            echo "Once installed, Neue checks here on launch and offers the next version itself."
            echo
            echo "This is the Neue track (\`neue-v*\`). It is separate from the Android \`v*\` releases and the 3DS \`3ds-v*\` ones."
            echo "**It is marked a pre-release on purpose.** GitHub's \`/releases/latest\` returns the newest non-pre-release of any tag, and the Android app's updater reads exactly that; the flag keeps this release from hiding the next APK. Neue reads its own track and is not affected."
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --notes-file "$NOTES"
            gh release upload "$TAG" neue-master-tool-* --clobber
          else
            gh release create "$TAG" neue-master-tool-* \
              --title "Neue Master Tool $NAME" \
              --notes-file "$NOTES" \
              --target "${{ github.sha }}" \
              --prerelease \
              --latest=false
          fi
